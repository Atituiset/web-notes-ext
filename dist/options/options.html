<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Markpilot 设置</title>
  <style>
    body { font: 14px/1.6 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; color: #1f2937; max-width: 640px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 18px; }
    section { border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    label { display: block; margin: 10px 0 4px; font-weight: 600; font-size: 13px; }
    input, select { width: 100%; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; font: inherit; }
    .row { display: flex; gap: 10px; align-items: center; }
    button { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 7px 16px; cursor: pointer; }
    button.secondary { background: #fff; color: #374151; border: 1px solid #d1d5db; }
    .status { font-size: 12px; color: #059669; margin-left: 10px; }
    .warn { color: #b45309; font-size: 12px; }
    code { background: #f3f4f6; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    .mem-item { border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 10px; margin-top: 6px; font-size: 13px; background: #fafafa; }
    .mem-item .meta { color: #6b7280; font-size: 11px; display: flex; gap: 6px; align-items: center; margin-bottom: 3px; flex-wrap: wrap; }
    .mem-item .body { white-space: pre-wrap; word-break: break-word; }
    .mem-item .ops { margin-top: 5px; display: flex; gap: 6px; }
    .mem-item .ops button, .mem-item .pin { border: 1px solid #d1d5db; background: #fff; border-radius: 5px; padding: 1px 8px; cursor: pointer; font-size: 11px; color: #374151; }
    .mem-item .danger { color: #dc2626 !important; border-color: #fecaca !important; }
    .mem-item.cold { opacity: .55; }
    .mem-item .cold-tag { color: #b45309; font-weight: 600; }
  </style>
</head>
<body>
  <h1>📝 Markpilot 设置</h1>

  <section>
    <h2>LLM Provider (BYOK)</h2>
    <label>Provider</label>
    <select id="provider"></select>
    <label>Base URL（可留空，用 provider 预设；自定义中转/vLLM 时填写）</label>
    <input id="baseUrl" placeholder="留空使用预设 / 或 http://localhost:11434/v1" />
    <label>模型名</label>
    <div class="row">
      <input id="model" list="model-list" placeholder="手填或点右侧「获取模型」" style="flex:1" />
      <button class="secondary" id="btn-models" type="button">获取模型</button>
    </div>
    <datalist id="model-list"></datalist>
    <div id="model-status" class="warn"></div>
    <p class="hint" style="color:#6b7280;font-size:12px;margin:6px 0">OpenRouter 无需 Key 即可拉取模型列表，免费模型会标 ⭐。</p>
    <label>API Key（仅存本机 IndexedDB，不上传）</label>
    <input id="apiKey" type="password" placeholder="本地模型无需填写" />
    <p class="warn">Key 仅存本机浏览器。Anthropic 浏览器直连已自动加 dangerous-direct-browser-access 头。</p>
  </section>

  <section>
    <h2>Obsidian Vault</h2>
    <div class="row">
      <button id="btn-pick">授权 vault 目录…</button>
      <span id="vault-state" class="warn"></span>
    </div>
    <label>导出子目录模板</label>
    <input id="vaultDirTemplate" placeholder="Clippings" />
    <label><input type="checkbox" id="exportAiQA" style="width:auto" /> AI 问答一并导出（默认关）</label>
  </section>

  <section>
    <h2>🧠 长期记忆</h2>
    <label><input type="checkbox" id="memoryInject" style="width:auto" /> 提问时自动注入相关记忆（默认开）</label>
    <label><input type="checkbox" id="autoMemory" style="width:auto" /> 自动提取记忆候选（默认关；产生角标待你确认）</label>
    <div class="row" style="margin-top:8px">
      <button class="secondary" id="btn-mem-mgr" type="button">管理记忆…</button>
      <span class="status" id="mem-count"></span>
    </div>
    <div id="mem-list"></div>
  </section>

  <button id="btn-save">保存设置</button><span class="status" id="save-status"></span>

  <script type="module" src="options.js"></script>
</body>
</html>
