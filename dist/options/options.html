<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title data-i18n="optionsTitle">Markpilot 设置</title>
  <style>
    :root {
      --bg: #f5f6f8; --bg-card: #ffffff; --bg-soft: #eef0f4; --bg-input: #ffffff;
      --border: #e4e7ec; --border-strong: #d3d8e0;
      --text: #1b2330; --text-2: #67707f; --text-3: #98a0ad;
      --accent: #2563eb; --accent-soft: #eaf1fe; --accent-border: #c2d6fb;
      --danger: #dc2626; --warn: #b45309; --ok: #059669;
      --r-sm: 8px; --r-md: 10px; --r-lg: 14px;
      --shadow-sm: 0 1px 2px rgba(16,24,40,.05);
      --shadow-md: 0 4px 14px rgba(16,24,40,.09);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1116; --bg-card: #171c24; --bg-soft: #1f2530; --bg-input: #131822;
        --border: #2a3140; --border-strong: #39414f;
        --text: #e2e7ee; --text-2: #9aa4b2; --text-3: #646e7d;
        --accent: #5b8def; --accent-soft: #1d2c4a; --accent-border: #2f4a7f;
        --danger: #f0645c; --warn: #e0a245; --ok: #3dbf8f;
        --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
        --shadow-md: 0 4px 14px rgba(0,0,0,.4);
      }
    }
    * { box-sizing: border-box; }
    body {
      font: 14px/1.6 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text); background: var(--bg); max-width: 680px; margin: 0 auto; padding: 28px 20px 48px;
    }
    h1 { font-size: 19px; margin: 0 0 18px; }
    section {
      border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px 20px; margin-bottom: 16px;
      background: var(--bg-card); box-shadow: var(--shadow-sm);
    }
    section h2 { font-size: 14.5px; margin: 0 0 6px; }
    label { display: block; margin: 12px 0 5px; font-weight: 600; font-size: 12.5px; color: var(--text-2); }
    input, select, textarea {
      width: 100%; padding: 7px 10px; border: 1px solid var(--border-strong); border-radius: var(--r-sm);
      box-sizing: border-box; font: inherit; background: var(--bg-input); color: var(--text);
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent);
    }
    input[type=checkbox] { accent-color: var(--accent); }
    .row { display: flex; gap: 10px; align-items: center; }
    button {
      background: var(--accent); color: #fff; border: none; border-radius: var(--r-md);
      padding: 8px 18px; cursor: pointer; font: inherit; font-weight: 600; transition: filter .15s;
    }
    button:hover { filter: brightness(1.1); }
    button.secondary {
      background: var(--bg-card); color: var(--text-2); border: 1px solid var(--border); font-weight: 400;
    }
    button.secondary:hover { color: var(--accent); border-color: var(--accent-border); background: var(--accent-soft); filter: none; }
    .status { font-size: 12px; color: var(--ok); margin-left: 10px; }
    .warn { color: var(--warn); font-size: 12px; }
    code { background: var(--bg-soft); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    /* 记忆条目 */
    .mem-item {
      border: 1px solid var(--border); border-radius: var(--r-md); padding: 10px 12px; margin-top: 8px;
      font-size: 13px; background: var(--bg-card); box-shadow: var(--shadow-sm);
    }
    .mem-item .meta { color: var(--text-3); font-size: 11px; display: flex; gap: 6px; align-items: center; margin-bottom: 3px; flex-wrap: wrap; }
    .mem-item .body { white-space: pre-wrap; word-break: break-word; }
    .mem-item .ops { margin-top: 6px; display: flex; gap: 6px; }
    .mem-item .ops button, .mem-item .pin {
      border: 1px solid var(--border); background: var(--bg-card); color: var(--text-2);
      border-radius: 6px; padding: 2px 9px; cursor: pointer; font-size: 11px; transition: all .15s;
    }
    .mem-item .ops button:hover { color: var(--accent); border-color: var(--accent-border); background: var(--accent-soft); }
    .mem-item .danger { color: var(--danger) !important; }
    .mem-item .danger:hover { border-color: var(--danger) !important; background: transparent !important; }
    .mem-item.cold { opacity: .55; }
    .mem-item .cold-tag { color: var(--warn); font-weight: 600; }
    /* 模型自定义下拉 */
    #model-dropdown {
      position: relative; display: none; max-height: 240px; overflow-y: auto;
      border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg-card); margin-top: 4px;
      box-shadow: var(--shadow-md); z-index: 10;
    }
    #model-dropdown .opt { padding: 6px 12px; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
    #model-dropdown .opt:hover, #model-dropdown .opt.hl { background: var(--accent-soft); }
    #model-dropdown .opt .free { color: var(--ok); font-weight: 600; white-space: nowrap; }
    #model-dropdown .empty { padding: 8px 12px; font-size: 12px; color: var(--text-3); }
  </style>
</head>
<body>
  <h1>📝 <span data-i18n="optionsTitle"></span></h1>

  <section>
    <h2>LLM Provider (BYOK)</h2>
    <label>Provider</label>
    <select id="provider"></select>
    <label data-i18n="labelBaseUrl"></label>
    <input id="baseUrl" data-i18n-ph="baseUrlPh" />
    <label data-i18n="labelModel"></label>
    <div class="row">
      <input id="model" data-i18n-ph="modelPh" style="flex:1" autocomplete="off" />
      <button class="secondary" id="btn-models" type="button" data-i18n="btnModels"></button>
      <button class="secondary" id="btn-test" type="button" data-i18n="btnTest"></button>
    </div>
    <div id="model-dropdown"></div>
    <div id="model-status" class="warn"></div>
    <div id="model-test-status" class="warn"></div>
    <p class="hint" style="color:#6b7280;font-size:12px;margin:6px 0" data-i18n="openrouterHint"></p>
    <label data-i18n="labelApiKey"></label>
    <input id="apiKey" type="password" data-i18n-ph="apiKeyPh" />
    <p class="warn" data-i18n="keyWarn"></p>
  </section>

  <section>
    <h2>System Prompt</h2>
    <label data-i18n="labelSystemPrompt"></label>
    <textarea id="systemPrompt" rows="4"></textarea>
    <div class="row" style="margin-top:6px">
      <button class="secondary" id="btn-prompt-reset" type="button" data-i18n="btnPromptReset"></button>
      <span style="color:#6b7280;font-size:12px" data-i18n="systemPromptHint"></span>
    </div>
  </section>

  <section>
    <h2>Obsidian Vault</h2>
    <div class="row">
      <button id="btn-pick" data-i18n="btnPickVault"></button>
      <span id="vault-state" class="warn"></span>
    </div>
    <label data-i18n="labelDirTemplate"></label>
    <input id="vaultDirTemplate" placeholder="Clippings" />
    <label><input type="checkbox" id="exportAiQA" style="width:auto" /> <span data-i18n="labelExportAiQA"></span></label>
  </section>

  <section>
    <h2 data-i18n="secMemory"></h2>
    <label><input type="checkbox" id="memoryInject" style="width:auto" /> <span data-i18n="labelMemoryInject"></span></label>
    <label><input type="checkbox" id="autoMemory" style="width:auto" /> <span data-i18n="labelAutoMemory"></span></label>
    <div class="row" style="margin-top:8px">
      <button class="secondary" id="btn-mem-mgr" type="button" data-i18n="btnMemMgr"></button>
      <span class="status" id="mem-count"></span>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="secondary" id="btn-profile" type="button" data-i18n="btnGenProfile"></button>
      <span class="status" id="profile-state"></span>
    </div>
    <div id="mem-list"></div>
  </section>

  <button id="btn-save" data-i18n="btnSaveSettings"></button><span class="status" id="save-status"></span>

  <script type="module" src="options.js"></script>
</body>
</html>
