<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Markpilot</title>
  <style>
    :root {
      --bg: #f5f6f8; --bg-card: #ffffff; --bg-soft: #eef0f4; --bg-input: #ffffff;
      --border: #e4e7ec; --border-strong: #d3d8e0;
      --text: #1b2330; --text-2: #67707f; --text-3: #98a0ad;
      --accent: #2563eb; --accent-soft: #eaf1fe; --accent-border: #c2d6fb;
      --danger: #dc2626; --warn: #b45309; --warn-bg: #fdf6e3; --warn-border: #f0c96a;
      --ok: #059669;
      --r-sm: 8px; --r-md: 10px; --r-lg: 14px;
      --shadow-sm: 0 1px 2px rgba(16,24,40,.05);
      --shadow-md: 0 4px 14px rgba(16,24,40,.09);
      --shadow-lg: 0 10px 32px rgba(16,24,40,.16);
      --code-bg: #141a24; --code-text: #e6ebf2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1116; --bg-card: #171c24; --bg-soft: #1f2530; --bg-input: #131822;
        --border: #2a3140; --border-strong: #39414f;
        --text: #e2e7ee; --text-2: #9aa4b2; --text-3: #646e7d;
        --accent: #5b8def; --accent-soft: #1d2c4a; --accent-border: #2f4a7f;
        --danger: #f0645c; --warn: #e0a245; --warn-bg: #2b2416; --warn-border: #6b5426;
        --ok: #3dbf8f;
        --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
        --shadow-md: 0 4px 14px rgba(0,0,0,.4);
        --shadow-lg: 0 10px 32px rgba(0,0,0,.55);
        --code-bg: #0a0e14; --code-text: #d5dce6;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 13px/1.55 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text); background: var(--bg);
      display: flex; flex-direction: column; height: 100vh;
    }
    button { font: inherit; }
    /* ---------- header ---------- */
    header {
      display: flex; align-items: center; gap: 6px;
      padding: 10px 14px; background: var(--bg-card); border-bottom: 1px solid var(--border);
    }
    header b { flex: 1; font-size: 14px; letter-spacing: .2px; }
    header button {
      border: 1px solid var(--border); background: var(--bg-card); color: var(--text-2);
      border-radius: var(--r-sm); padding: 4px 10px; cursor: pointer; font-size: 12px;
      transition: all .15s;
    }
    header button:hover { color: var(--accent); border-color: var(--accent-border); background: var(--accent-soft); }
    /* ---------- tabs（分段控件） ---------- */
    nav.tabs {
      display: flex; gap: 4px; padding: 6px; margin: 10px 12px 0;
      background: var(--bg-soft); border-radius: var(--r-md);
    }
    nav.tabs button {
      flex: 1; padding: 6px; background: none; border: none; cursor: pointer;
      color: var(--text-2); font-size: 12.5px; border-radius: 7px; transition: all .15s;
    }
    nav.tabs button:hover { color: var(--text); }
    nav.tabs button.active {
      color: var(--text); background: var(--bg-card); font-weight: 600; box-shadow: var(--shadow-sm);
    }
    main { padding: 12px 14px; padding-right: 22px; overflow-y: auto; flex: 1; min-height: 0; scrollbar-gutter: stable; position: relative; }
    main::-webkit-scrollbar { width: 8px; }
    main::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
    .empty { color: var(--text-3); text-align: center; padding: 28px 0; font-size: 12.5px; line-height: 1.7; }
    /* ---------- 笔记卡片 ---------- */
    .item {
      border: 1px solid var(--border); border-radius: var(--r-lg); padding: 10px 12px; margin-top: 10px;
      background: var(--bg-card); box-shadow: var(--shadow-sm); transition: box-shadow .15s;
    }
    .item:hover { box-shadow: var(--shadow-md); }
    .item .meta { color: var(--text-3); font-size: 11.5px; margin-bottom: 4px; display: flex; gap: 6px; align-items: center; }
    .item .meta .url { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 分级分组标题与 site 徽标 */
    .sec-h { color: var(--text-3); font-size: 11.5px; font-weight: 600; letter-spacing: .3px; margin: 16px 2px -4px; }
    .item .meta .scope-tag { color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0 5px; font-size: 10.5px; }
    .item .quote {
      background: var(--warn-bg); border-left: 3px solid var(--warn-border); color: var(--warn);
      font-size: 12px; padding: 5px 8px; margin: 6px 0; max-height: 64px; overflow: auto; border-radius: 0 var(--r-sm) var(--r-sm) 0;
    }
    .item .text { white-space: pre-wrap; word-break: break-word; max-height: 160px; overflow: auto; margin: 4px 0 8px; }
    .item .ops { display: flex; gap: 6px; }
    .item .ops button {
      border: 1px solid var(--border); background: var(--bg-card); color: var(--text-2);
      border-radius: 7px; padding: 3px 10px; cursor: pointer; font-size: 11.5px; transition: all .15s;
    }
    .item .ops button:hover { color: var(--accent); border-color: var(--accent-border); background: var(--accent-soft); }
    .item .ops button.danger:hover { color: var(--danger); border-color: var(--danger); background: transparent; }
    /* ---------- 聊天气泡 ---------- */
    .msg { border-radius: var(--r-lg); padding: 10px 12px; margin-top: 10px; max-width: 100%; box-shadow: var(--shadow-sm); }
    .msg.user {
      background: var(--accent-soft); border: 1px solid var(--accent-border); white-space: pre-wrap;
    }
    .msg.assistant { background: var(--bg-card); border: 1px solid var(--border); }
    .msg .who { font-size: 11px; color: var(--text-3); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; font-weight: 600; letter-spacing: .3px; }
    .msg .who .ops { margin-left: auto; display: none; gap: 4px; font-weight: 400; }
    .msg.assistant.done .who .ops { display: flex; }
    .msg .who .ops button {
      border: 1px solid var(--border); background: var(--bg-card); color: var(--text-2);
      border-radius: 6px; padding: 1px 8px; cursor: pointer; font-size: 11px; transition: all .15s;
    }
    .msg .who .ops button:hover { color: var(--accent); border-color: var(--accent-border); background: var(--accent-soft); }
    .msg .body :is(p, ul, ol, pre, blockquote, table) { margin: 6px 0; }
    .msg .body ul, .msg .body ol { padding-left: 20px; }
    .msg .body li { margin: 2px 0; }
    .msg .body code { background: var(--bg-soft); border-radius: 4px; padding: 1px 5px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
    .msg .body pre {
      position: relative; background: var(--code-bg); color: var(--code-text);
      border-radius: var(--r-md); padding: 10px 12px; overflow-x: auto; font-size: 12px; line-height: 1.5;
    }
    .msg .body pre code { background: none; color: inherit; padding: 0; white-space: pre; }
    .msg .body pre .copy-code {
      position: sticky; top: 0; float: right; border: 1px solid #374151; background: #1f2937; color: #9ca3af;
      border-radius: 6px; padding: 1px 8px; cursor: pointer; font-size: 11px;
    }
    .msg .body pre .copy-code:hover { color: #fff; }
    .msg .body pre .lang-tag { position: absolute; top: 6px; left: 12px; font-size: 10px; color: #6b7280; text-transform: uppercase; letter-spacing: .5px; }
    .msg .body blockquote { border-left: 3px solid var(--accent-border); color: var(--text-2); padding-left: 10px; }
    .msg .body table { border-collapse: collapse; font-size: 12px; }
    .msg .body :is(td, th) { border: 1px solid var(--border-strong); padding: 4px 8px; }
    .msg .body h1, .msg .body h2, .msg .body h3, .msg .body h4 { margin: 10px 0 5px; font-size: 13.5px; }
    /* 思考过程折叠块 */
    details.thinking { margin: 4px 0 8px; border: 1px dashed var(--border-strong); border-radius: var(--r-md); background: var(--bg-soft); }
    details.thinking summary { cursor: pointer; padding: 5px 12px; font-size: 12px; color: var(--text-2); user-select: none; border-radius: var(--r-md); }
    details.thinking[open] summary { border-bottom: 1px dashed var(--border); }
    .thinking-body { padding: 8px 12px; font-size: 12px; color: var(--text-2); white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow-y: auto; }
    /* ---------- 错误提示 ---------- */
    .err {
      color: var(--danger); background: color-mix(in srgb, var(--danger) 7%, var(--bg-card));
      border: 1px solid color-mix(in srgb, var(--danger) 25%, transparent);
      border-radius: var(--r-md); padding: 10px 12px; margin-top: 10px; white-space: pre-wrap; font-size: 12.5px;
    }
    /* ---------- 输入区 ---------- */
    .chat-input-wrap { padding: 12px 14px; border-top: 1px solid var(--border); background: var(--bg-card); display: none; flex-shrink: 0; }
    .chat-input-wrap textarea {
      width: 100%; min-height: 60px; resize: vertical; border: 1px solid var(--border-strong);
      border-radius: var(--r-md); padding: 8px 10px; font: inherit; background: var(--bg-input); color: var(--text);
      transition: border-color .15s, box-shadow .15s;
    }
    .chat-input-wrap textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }
    .chat-input-wrap .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
    .chat-input-wrap select {
      flex: 1; border: 1px solid var(--border); border-radius: var(--r-sm); padding: 4px 8px; font-size: 12px;
      background: var(--bg-input); color: var(--text-2);
    }
    .chat-input-wrap .send {
      background: var(--accent); color: #fff; border: none; border-radius: var(--r-md);
      padding: 7px 18px; cursor: pointer; font-weight: 600; transition: filter .15s;
      white-space: nowrap; flex-shrink: 0;
    }
    .chat-input-wrap .send:hover { filter: brightness(1.1); }
    .chat-input-wrap .send:disabled { opacity: .5; cursor: default; }
    .chat-input-wrap .send.stop { background: var(--danger); }
    .hint { color: var(--text-3); font-size: 11px; }
    #model-hint { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* ---------- 打字指示 ---------- */
    .typing { display: inline-flex; gap: 4px; padding: 6px 0; }
    .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,80%,100% { opacity:.25 } 40% { opacity:1 } }
    /* ---------- 回到底部 ---------- */
    #btn-scroll-bottom {
      position: absolute; right: 16px; bottom: 130px; display: none;
      width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--bg-card); color: var(--text-2); cursor: pointer; box-shadow: var(--shadow-md);
      z-index: 10; font-size: 14px; line-height: 1; transition: all .15s;
    }
    #btn-scroll-bottom:hover { color: var(--accent); border-color: var(--accent-border); }
    /* ---------- starters / followups ---------- */
    .starters, .followups { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .starter {
      text-align: left; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-2);
      border-radius: var(--r-lg); padding: 10px 14px; cursor: pointer; font-size: 12.5px;
      transition: all .15s; box-shadow: var(--shadow-sm);
    }
    .starter:hover {
      border-color: var(--accent-border); color: var(--accent); background: var(--accent-soft);
      transform: translateY(-1px); box-shadow: var(--shadow-md);
    }
    .followups { margin-top: 8px; }
    /* ---------- 会话列表 ---------- */
    #thread-list {
      display: none; position: absolute; top: 46px; right: 12px; width: 260px; max-height: 60vh;
      overflow-y: auto; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-lg);
      box-shadow: var(--shadow-lg); z-index: 50; padding: 6px;
    }
    .thread-item { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: var(--r-sm); cursor: pointer; font-size: 12.5px; }
    .thread-item:hover { background: var(--bg-soft); }
    .thread-item .thread-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .thread-item .thread-del { border: none; background: none; color: var(--text-3); cursor: pointer; font-size: 11px; padding: 0 3px; }
    .thread-item .thread-del:hover { color: var(--danger); }
  </style>
</head>
<body>
  <header>
    <b>📝 Markpilot</b>
    <button id="btn-new-chat" data-i18n-title="newChatTitle" style="display:none">✚ <span data-i18n="newChat"></span></button>
    <button id="btn-threads" data-i18n-title="threadsTitle">🕘</button>
    <button id="btn-export" data-i18n="exportPage"></button>
    <button id="btn-download" data-i18n="downloadMd" data-i18n-title="downloadMdTitle"></button>
    <button id="btn-options">⚙</button>
  </header>
  <nav class="tabs">
    <button data-tab="notes" class="active" data-i18n="tabNotes"></button>
    <button data-tab="chat" data-i18n="tabChat"></button>
  </nav>
  <main id="main"></main>
  <button id="btn-scroll-bottom" data-i18n-title="scrollBottomTitle">↓</button>
  <div id="thread-list"></div>
  <div class="chat-input-wrap" id="chat-input-wrap">
    <textarea id="chat-q" data-i18n-ph="chatPlaceholder"></textarea>
    <div class="row">
      <select id="chat-scope">
        <option value="page" data-i18n="scopePage"></option>
        <option value="selection" data-i18n="scopeSelection"></option>
      </select>
      <span class="hint" id="model-hint"></span>
      <button class="send" id="btn-send" data-i18n="sendBtn"></button>
    </div>
  </div>

  <script type="module" src="panel.js"></script>
</body>
</html>
